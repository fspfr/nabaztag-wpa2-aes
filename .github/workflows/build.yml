name: Build firmware

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "overlay/**"
      - "files/**"
      - "patches/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Get nabgcc sources
        run: git clone --depth 1 https://github.com/RedoXyde/nabgcc.git nabgcc

      - name: Get packaging template (testwpa.sim)
        run: git clone --depth 1 https://github.com/RedoXyde/firmware_nabaztag.git fwrepo

      - name: Apply overlay (corrected source files)
        run: |
          if [ -d overlay ] && [ -n "$(ls -A overlay 2>/dev/null)" ]; then
            cp -rv overlay/* nabgcc/
          else
            echo "no overlay - vanilla build"
          fi

      - name: Apply WPA2-AES patch
        run: |
          cp files/aes.h nabgcc/inc/net/aes.h
          cp files/aes.c nabgcc/src/net/aes.c
          sed -i 's/\r$//' nabgcc/inc/net/ieee80211.h nabgcc/inc/net/eapol.h nabgcc/src/net/ieee80211.c nabgcc/src/net/eapol.c
          patch -d nabgcc -p1 < patches/wpa2.patch

      - name: Swap in WPA-WPA2 config bytecode (RedoX 12wpa)
        run: python3 files/extract_bc.py fwrepo/fw_wpa_wpa2_src/bc.c nabgcc/src/bc.c

      - name: GCC fixes (IAR compat types + newlib stubs)
        run: |
          printf 'typedef unsigned char uchar;\ntypedef unsigned short ushort;\ntypedef unsigned int uint;\ntypedef unsigned long ulong;\n' >> nabgcc/sys/inc/common.h
          cp files/syscalls.c nabgcc/src/utils/syscalls.c

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi

      - name: Build
        run: |
          cd nabgcc
          (make 2>&1 || true) | tee build.log
          ls -la bin/ || true

      - name: Package flashable .sim.txt
        run: |
          mkdir -p out
          if [ -f nabgcc/bin/Nab.bin ]; then
            python3 files/pack_sim.py fwrepo/fw_wpa_wpa2_src/testwpa.sim nabgcc/bin/Nab.bin out/firmware-42.sim out/firmware-42.sim.txt
          else
            echo 'Nab.bin missing - packaging skipped' | tee out/packaging-skipped.txt
          fi

      - name: Collect outputs
        if: always()
        run: |
          cp nabgcc/build.log out/ 2>/dev/null || true
          cp nabgcc/obj/Nab.map out/ 2>/dev/null || true
          head -c 2000 out/firmware-42.sim.txt > out/firmware-head.txt 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: out/
          if-no-files-found: warn

      - name: Commit build log back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          cp nabgcc/build.log logs/build.log 2>/dev/null || echo "build failed before log" > logs/build.log
          git add logs
          git commit -m "build log [skip ci]" || echo "nothing to commit"
          git push
